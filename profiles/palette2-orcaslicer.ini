# Palette 2 profile for OrcaSlicer
# Install: OrcaSlicer > Settings > Printer > Add > Load profile
[printer]
printer_model = Palette 2
printer_variant = 0.4
printer_technology = FFF
host_type = orcaslicer
gcode_flavor = marlin2
max_print_height = 200
bed_shape = 256x256
printable_area = 256x256
nozzle_diameter = 0.4
min_layer_height = 0.05
max_layer_height = 0.3

[extruder_0]
filament_diameter = 1.75
nozzle_diameter = 0.4

[extruder_1]
filament_diameter = 1.75
nozzle_diameter = 0.4

[extruder_2]
filament_diameter = 1.75
nozzle_diameter = 0.4

[extruder_3]
filament_diameter = 1.75
nozzle_diameter = 0.4

[post_process]
script = p2pp
args = --palette p2 --ping-interval 350 --splice-tolerance 0.5
