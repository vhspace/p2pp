# OrcaSlicer config bundle — Palette 2 (Multi-Material, single extruder)
# Import via OrcaSlicer: File > Import > Import Config(s)

[printer:Palette 2 MM]
bed_shape = 0x0,200x0,200x200,0x200
origin = 0x0
num_extruders = 4
single_extruder_multi_material = 1
single_extruder_multi_material_priming = 0
single_extruder_multi_material_solid_infill = 0
single_extruder_multi_material_perimeters = 0
single_extruder_multi_material_infill = 0
wipe_tower = 1
wipe_tower_rotation_angle = 0
filament_settings_id = PLA,PETG,PVA,ABS
start_gcode = G28 ; home all axes
;P2PP PRINTERPROFILE=<your-printer-profile-id>
;P2PP LINEARPINGLENGTH=350
;P2PP SPLICEOFFSET=30
;P2PP MINSTARTSPLICE=135
;P2PP MINSPLICE=90
;P2PP EXTRAENDFILAMENT=120
;P2PP PINGPONG_SPLICE=ENABLED
;P2PP MATERIAL_DEFAULT_0_0_0
;P2PP MATERIAL_PLA_PLA_2_0_2
;P2PP MATERIAL_PET_PET_2_1_4
;P2PP MATERIAL_PVA_PVA_0_0_0
;P2PP MATERIAL_ABS_ABS_4_0_0
;P2PP MATERIAL_TPU_TPU_2_6_10

[filament:PLA]
filament_type = PLA
[filament:PETG]
filament_type = PETG
[filament:PVA]
filament_type = PVA
[filament:ABS]
filament_type = ABS
[filament:TPU]
filament_type = TPU
