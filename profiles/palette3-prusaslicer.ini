# Palette 3 profile for PrusaSlicer
# Install: PrusaSlicer > Settings > Printer > Add > Load from file
[printer]
printer_model = Palette 3
printer_variant = 0.4
printer_technology = FFF
host_type = prusalink
gcode_flavor = marlin2
max_print_height = 200
bed_shape = 250x210
printable_area = 250x210
nozzle_diameter = 0.4
min_layer_height = 0.05
max_layer_height = 0.3

# Multi-color extruder setup (4 colors)
[extruder_0]
filament_diameter = 1.75
nozzle_diameter = 0.4

[extruder_1]
filament_diameter = 1.75
nozzle_diameter = 0.4

[extruder_2]
filament_diameter = 1.75
nozzle_diameter = 0.4

[extruder_3]
filament_diameter = 1.75
nozzle_diameter = 0.4

# Palette 3 post-processing
[post_process]
script = p2pp
args = --palette p3 --ping-interval 300 --splice-tolerance 0.3 --enable-ping-logging
