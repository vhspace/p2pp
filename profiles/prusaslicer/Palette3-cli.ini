# Flat PrusaSlicer config for headless CLI slicing (issue #100).
#
# This is NOT the user-facing profile — that is profiles/prusaslicer/Palette3.ini,
# a config *bundle* imported via File > Import > Import Config Bundle.
# PrusaSlicer's `--load` only accepts a flat config (no [section] headers), so CI
# uses this file:
#
#   prusa-slicer --export-gcode --load profiles/prusaslicer/Palette3-cli.ini \
#                --output raw.gcode tests/models/multi-color.stl
#
# Extruder count is derived from the number of values in the per-extruder vectors
# below (4). Tool changes are forced by assigning different features to different
# extruders, so a single-object STL exercises the full splice path.

printer_technology = FFF
printer_model = Palette 3
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 210
nozzle_diameter = 0.4,0.4,0.4,0.4
extruder_offset = 0x0,0x0,0x0,0x0
retract_length = 0.8,0.8,0.8,0.8
retract_speed = 35,35,35,35
retract_lift = 0.2,0.2,0.2,0.2
single_extruder_multi_material = 1
single_extruder_multi_material_priming = 0
gcode_flavor = marlin
gcode_comments = 0
thumbnails =

# --- filaments (4 inputs, distinct colours so O25 is meaningful) -------------
filament_type = PLA,PLA,PLA,PLA
filament_diameter = 1.75,1.75,1.75,1.75
filament_colour = #FF0000,#00FF00,#0000FF,#FFFF00
temperature = 210,210,210,210
first_layer_temperature = 215,215,215,215
bed_temperature = 60,60,60,60
first_layer_bed_temperature = 60,60,60,60

# --- print settings ---------------------------------------------------------
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 3
bottom_solid_layers = 3
fill_density = 20%
fill_pattern = grid
support_material = 0

# Force tool changes on a single-object model: each feature type gets its own
# extruder. Without this a 1-object STL slices as single-colour and p2pp has no
# splices to emit.
perimeter_extruder = 1
infill_extruder = 2
solid_infill_extruder = 3
top_solid_infill_extruder = 4
support_material_extruder = 1
support_material_interface_extruder = 1

wipe_tower = 1
wipe_tower_x = 170
wipe_tower_y = 140
wipe_tower_width = 60
wipe_tower_rotation_angle = 0

# --- p2pp configuration -----------------------------------------------------
# Kept in sync with profiles/prusaslicer/Palette3.ini. Deliberately omits
# P3_UPLOADFILE / P3_HOSTNAME / P3_SHOWPRINTERPAGE: CI has no Palette to talk to
# and those directives would make p2pp attempt network I/O.
start_gcode = G28 ; home all axes\nG1 Z5 F5000\n;P2PP PALETTE3_PRO\n;P2PP PRINTERPROFILE=0123456789abcdef\n;P2PP LINEARPINGLENGTH=350\n;P2PP SPLICEOFFSET=30\n;P2PP MINSTARTSPLICE=100\n;P2PP MINSPLICE=70\n;P2PP EXTRAENDFILAMENT=200\n;P2PP MATERIAL_DEFAULT_0_0_0\n;P2PP MATERIAL_PLA_PLA_2_1_2

# p2pp/psconfig.py:127 parses this block to recover the wipe tower position.
end_gcode = ; EXTRA_CONFIG_VARIABLES\n; wipe_tower_x = {wipe_tower_x}\n; wipe_tower_y = {wipe_tower_y}\nM104 S0 ; turn off temperature\nM140 S0\nG28 X0\nM84