name: live-test

# End-to-end validation of p2pp output (issue #86).
# lint-selftest always runs; slice-and-lint is best-effort until the slicer
# container (sub-issue 1) and Palette printer profiles (sub-issue 2) land.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-selftest:
    name: G-code lint self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run lint validator unit tests
        run: python3 tests/test_lint_gcode.py

  slice-and-lint:
    name: Slice with PrusaSlicer and lint
    runs-on: ubuntu-latest
    continue-on-error: true  # until sub-issues 1 and 2 land
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PrusaSlicer AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb
          # TODO(#86 sub-issue 1): pin a PrusaSlicer release and cache it.
          echo "PrusaSlicer install pending container work"
      - name: Slice, post-process and lint
        run: |
          # TODO(#86 sub-issue 2): add a Palette 3 printer profile + test model.
          xvfb-run -a bash scripts/slice_and_lint.sh tests/models/2color-cube.stl \
            || echo "slice stage skipped (no slicer/profile yet)"