name: live-test

# End-to-end validation of p2pp output (issues #86, #100).
#
#   PrusaSlicer (Flathub, pinnable) -> p2pp -> G-code lint -> Palette 3 simulator
#
# The P3 firmware is downloaded from Mosaic's public S3 bucket and run under
# QEMU ARM emulation. See docs/e2e_pipeline.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  PRUSASLICER_FLATPAK_COMMIT: ''

jobs:
  lint-selftest:
    name: Validator self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run lint validator unit tests
        run: python3 tests/test_lint_gcode.py
      - name: Run Palette 3 simulator unit tests
        run: python3 tests/test_p3_simulator.py

  # Fast pipeline: slice → p2pp → lint (no P3 firmware, ~2 min)
  e2e-slice:
    name: Slice -> p2pp -> lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load pinned versions
        run: cat .slicer-versions.env >> "$GITHUB_ENV"

      - name: Install p2pp dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
          python3 -m pip install --upgrade pip
          pip install -r requirements-common.txt -r requirements-linux.txt

      - name: Cache Flatpak installation
        uses: actions/cache@v4
        with:
          path: /var/lib/flatpak
          key: flatpak-prusaslicer-${{ env.PRUSASLICER_FLATPAK_COMMIT || 'stable' }}

      - name: Install PrusaSlicer from Flathub
        run: bash scripts/install_prusaslicer.sh

      - name: Run slice + p2pp + lint pipeline
        run: |
          # Run stages 1-3 only (skip P3 simulator stage 4)
          export P2PP_SKIP_P3=1
          bash scripts/e2e_pipeline.sh

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-p2pp-output
          path: .live-test-out/
          if-no-files-found: warn

  # Slow pipeline: full P3 firmware acceptance (separate job, runs in parallel)
  e2e-p3-firmware:
    name: P3 firmware acceptance
    runs-on: ubuntu-latest
    continue-on-error: true  # best-effort: 405MB download + QEMU is slow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load pinned versions
        run: cat .slicer-versions.env >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            p7zip-full docker-compose python3-pip
          pip install -r requirements-common.txt

      - name: Cache P3 firmware
        uses: actions/cache@v4
        with:
          path: /tmp/p3-firmware
          key: p3-firmware-${{ env.P3_FIRMWARE_VERSION }}

      - name: Install P3 firmware (QEMU + Docker)
        run: bash scripts/install_p3_firmware.sh

      - name: Run P3 simulator against processed G-code
        run: |
          # Download the pre-processed G-code from the slice job artifact
          # or run the full pipeline if artifacts aren't available
          if [ -f .live-test-out/processed.gcode ]; then
            python3 tests/p3_simulator.py .live-test-out/processed.gcode
          else
            echo "No processed G-code found — running full pipeline"
            export P2PP_SKIP_P3=1
            bash scripts/e2e_pipeline.sh || true
            if [ -f .live-test-out/processed.gcode ]; then
              python3 tests/p3_simulator.py .live-test-out/processed.gcode
            fi
          fi