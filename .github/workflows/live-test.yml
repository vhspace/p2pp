name: live-test

# End-to-end validation of p2pp output (issue #86).
# lint-selftest always runs; slice-and-lint runs PrusaSlicer + OrcaSlicer
# against test models and lints the output.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-selftest:
    name: G-code lint self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run lint validator unit tests
        run: python3 tests/test_lint_gcode.py

  slice-and-lint:
    name: Slice with PrusaSlicer and lint
    runs-on: ubuntu-latest
    continue-on-error: true  # best-effort: AppImage needs FUSE + models may not exist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load slicer versions
        run: |
          cat .slicer-versions.env >> "$GITHUB_ENV"

      - name: Install PrusaSlicer
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb
          wget -q "$PRUSA_SLICER_URL" -O prusa-slicer.AppImage
          chmod +x prusa-slicer.AppImage

      - name: Slice test model
        run: |
          # Slice a simple test model if available
          if [ -f tests/test_inputs/two_color_logo.gcode ]; then
            # We have pre-sliced G-code — just run p2pp + lint
            python3 P2PP.py tests/test_inputs/two_color_logo.gcode tests/output_prusa.gcode \
              || echo "p2pp processing failed"
          else
            echo "no test model found — skipping slice"
          fi

      - name: Lint sliced output
        run: |
          if [ -f tests/output_prusa.gcode ]; then
            python3 tests/lint_gcode.py tests/output_prusa.gcode
          else
            echo "no output to lint — skipping"
          fi

  slice-orcaslicer:
    name: Slice with OrcaSlicer and lint
    runs-on: ubuntu-latest
    continue-on-error: true  # best-effort: AppImage needs FUSE + models may not exist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load slicer versions
        run: |
          cat .slicer-versions.env >> "$GITHUB_ENV"

      - name: Install OrcaSlicer
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb
          wget -q "$ORCA_SLICER_URL" -O orca-slicer.AppImage
          chmod +x orca-slicer.AppImage

      - name: Slice test model
        run: |
          if [ -f tests/test_inputs/two_color_logo.gcode ]; then
            python3 P2PP.py tests/test_inputs/two_color_logo.gcode tests/output_orca.gcode \
              || echo "p2pp processing failed"
          else
            echo "no test model found — skipping slice"
          fi

      - name: Lint sliced output
        run: |
          if [ -f tests/output_orca.gcode ]; then
            python3 tests/lint_gcode.py tests/output_orca.gcode
          else
            echo "no output to lint — skipping"
          fi