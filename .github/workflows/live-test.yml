name: live-test

# End-to-end validation of p2pp output (issues #86, #100).
#
#   PrusaSlicer (Flathub, pinnable) -> p2pp -> G-code lint -> Palette 3 simulator
#
# The Palette 3 stage is a behavioural simulator, not emulated firmware: Mosaic
# publishes no redistributable P3 firmware image, so there is nothing to boot
# under QEMU in public CI. See docs/e2e_pipeline.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # Pin a Flathub build here (see docs/e2e_pipeline.md and issue #99).
  # Empty means "current stable".
  PRUSASLICER_FLATPAK_COMMIT: ''

jobs:
  lint-selftest:
    name: Validator self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run lint validator unit tests
        run: python3 tests/test_lint_gcode.py
      - name: Run Palette 3 simulator unit tests
        run: python3 tests/test_p3_simulator.py

  e2e-pipeline:
    name: Slice -> p2pp -> lint -> P3 simulator
    runs-on: ubuntu-latest
    continue-on-error: true  # best-effort: needs Xvfb + Flatpak (Docker container #88 will provide)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install p2pp dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
          python3 -m pip install --upgrade pip
          pip install -r requirements-common.txt -r requirements-linux.txt

      - name: Cache Flatpak installation
        uses: actions/cache@v4
        with:
          path: /var/lib/flatpak
          key: flatpak-prusaslicer-${{ env.PRUSASLICER_FLATPAK_COMMIT || 'stable' }}

      - name: Install PrusaSlicer from Flathub
        run: bash scripts/install_prusaslicer.sh

      - name: Run end-to-end pipeline
        run: bash scripts/e2e_pipeline.sh

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-output
          path: .live-test-out/
          if-no-files-found: warn