name: Build Multi-Platform Binaries

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    uses: ./.github/workflows/build-packages.yml
    with:
      upload_to_release: false
      use_production_signing: false

  test-orcaslicer:
    runs-on: ubuntu-latest
    continue-on-error: true  # best-effort: AppImage + test model may not be ready
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-linux.txt
        
    - name: Download OrcaSlicer AppImage
      run: |
        wget -q "https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.3.0/OrcaSlicer_Linux_AppImage_V2.3.0.AppImage" -O OrcaSlicer.AppImage
        chmod +x OrcaSlicer.AppImage

    - name: Test OrcaSlicer G-code compatibility
      run: |
        # Slice test model with OrcaSlicer
        ./OrcaSlicer.AppImage --slice test_model.3mf --output test_output.gcode --config test_config.ini
        # Run p2pp on output
        python -m p2pp test_output.gcode test_processed.gcode
        # Validate with lint validator
        python -m gcode_lint_validator test_processed.gcode